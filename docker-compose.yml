services:
  backend:
    build: ./backend
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      DATA_DIR: /data
    volumes:
      - paper-data:/data
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_PROXY=http://backend:5000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  paper-data:
